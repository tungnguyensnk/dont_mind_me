<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF9F2">
  <title>Don't mind me</title>
  <link rel="stylesheet" href="fonts.css">
  <style>
    :root{
      --kg-font-display:'M PLUS Rounded 1c','Be Vietnam Pro',system-ui,sans-serif;
      --kg-font-body:'Be Vietnam Pro',system-ui,sans-serif;
      --kg-mono:ui-monospace,'Roboto Mono','DejaVu Sans Mono',monospace;
      --kg-canvas:#F3EAE0;--kg-bg:#FFF9F2;--kg-surface:#FFFFFF;--kg-surface-2:#FAF2E8;--kg-surface-3:#F3EAE0;
      --kg-border:#F0E3D3;--kg-border-2:#E9DCCD;--kg-divider:#F7EDE1;--kg-track:#F0E3D3;--kg-track-2:#EADCCB;
      --kg-ink:#43352B;--kg-ink-2:#7A6555;--kg-muted:#8A7767;--kg-muted-2:#A08D7B;--kg-hint:#C9B7A5;
      --kg-primary:oklch(0.72 0.17 45);--kg-primary-text:oklch(0.55 0.15 45);--kg-primary-tint:oklch(0.95 0.03 45);--kg-primary-tint-2:oklch(0.96 0.03 45);--kg-primary-border:oklch(0.88 0.07 45);--kg-on-primary:#FFFFFF;
      --kg-gold:oklch(0.78 0.13 85);
      --kg-success:oklch(0.62 0.14 152);--kg-success-tint:oklch(0.95 0.04 152);--kg-success-text:oklch(0.45 0.12 152);
      --kg-danger:oklch(0.65 0.16 30);--kg-danger-tint:oklch(0.96 0.03 30);--kg-danger-text:oklch(0.5 0.14 30);
      --kg-scrim:rgba(60,35,15,0.45);--kg-card-border:transparent;
      --kg-shadow-card:0 3px 12px rgba(120,80,40,0.07);--kg-shadow-icon:0 2px 8px rgba(120,80,40,0.1);--kg-shadow-float:0 4px 16px rgba(120,80,40,0.1);--kg-shadow-knob:0 2px 5px rgba(60,30,10,0.25);--kg-shadow-dialog:0 24px 60px rgba(60,30,10,0.25);
      --kg-ease:cubic-bezier(0.3,0.1,0.2,1);
      color-scheme:light;
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--kg-bg);color:var(--kg-ink);font:500 15px/1.5 var(--kg-font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
    [hidden]{display:none!important}
    .mono{font-family:var(--kg-mono)}

    .wrap{max-width:460px;margin:0 auto;min-height:100vh}
    .pull{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:height 300ms var(--kg-ease),opacity 300ms ease}
    .pull.drag{transition:none}
    .pull-pill{margin-bottom:8px;background:var(--kg-surface);border:1px solid var(--kg-card-border);border-radius:999px;padding:6px 14px;box-shadow:var(--kg-shadow-icon);font-size:12px;font-weight:700;color:var(--kg-muted)}

    .head{position:sticky;top:0;z-index:5;background:var(--kg-bg);padding:14px 20px 12px;padding-top:max(14px,env(safe-area-inset-top))}
    .head-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title{margin:0;font:800 24px/1.2 var(--kg-font-display);letter-spacing:-.01em}
    .pill{display:flex;align-items:center;gap:8px;background:var(--kg-surface);border:1px solid var(--kg-card-border);border-radius:999px;padding:8px 14px;box-shadow:var(--kg-shadow-icon);flex:none}
    .pill-dot{width:10px;height:10px;border-radius:50%;background:var(--kg-hint);transition:background 200ms ease}
    #pill-label{font-weight:700;font-size:13px;white-space:nowrap}
    .subhead{margin-top:12px;display:flex;flex-direction:column;gap:12px}
    .subhead-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
    .h2{font:800 20px/1.3 var(--kg-font-display)}
    .count{font-size:13px;font-weight:700;color:var(--kg-primary-text);white-space:nowrap}
    .search-wrap{position:relative}
    #search{width:100%;padding:13px 44px 13px 18px;border:2px solid var(--kg-border);border-radius:999px;background:var(--kg-surface);color:var(--kg-ink);font:500 15px/1.4 var(--kg-font-body);-webkit-appearance:none}
    #search:focus{outline:none;border-color:var(--kg-primary)}
    #search::placeholder{color:var(--kg-hint)}
    .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--kg-surface-3);color:var(--kg-muted);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer}

    .body{padding:0 20px calc(206px + env(safe-area-inset-bottom))}
    .panel{display:flex;flex-direction:column;gap:22px;padding-top:12px}
    .group{display:flex;flex-direction:column;gap:12px}
    .slabel{font:700 12px/1.3 var(--kg-font-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kg-muted-2);margin-top:4px}
    .flabel{font:700 12.5px/1.3 var(--kg-font-body);color:var(--kg-muted)}
    .col{display:flex;flex-direction:column;gap:10px}
    .inrow{display:flex;align-items:center;gap:8px}
    .hint{font:500 12px/1.5 var(--kg-font-body);color:var(--kg-muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    .hint svg{width:13px;height:13px;flex:none}
    .line-ok{font-size:12px;color:var(--kg-success-text)}
    .line-err{font-size:12px;color:var(--kg-danger-text)}

    .card{background:var(--kg-surface);border-radius:22px;box-shadow:var(--kg-shadow-card);border:1px solid var(--kg-card-border)}
    .card.list{border-radius:20px;overflow:hidden}
    .card.pad{padding:18px}
    .card.pad-sm{padding:14px 16px}

    .approw{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;cursor:pointer;user-select:none;transition:background 180ms ease}
    .approw+.approw{border-top:1px solid var(--kg-divider)}
    .approw.sel{background:var(--kg-primary-tint-2)}
    .check{width:24px;height:24px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--kg-hint);background:var(--kg-surface);color:transparent}
    .approw.sel .check{border-color:var(--kg-primary);background:var(--kg-primary);color:var(--kg-on-primary)}
    .check svg{width:15px;height:15px}
    .pkg{font-family:var(--kg-mono);font-size:13px;line-height:1.35;overflow-wrap:anywhere;min-width:0}
    .skel{display:flex;align-items:center;gap:12px;padding:14px 16px}
    .skel+.skel{border-top:1px solid var(--kg-divider)}
    .skel .box{width:24px;height:24px;border-radius:8px;background:var(--kg-surface-3);flex:none}
    .skel .bar{height:10px;border-radius:999px;background:var(--kg-surface-3)}
    .empty{padding:22px 16px;font-size:13px;color:var(--kg-muted);text-align:center}

    .swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
    .card.list .swrow+.swrow{border-top:1px solid var(--kg-divider)}
    .swtext{display:flex;flex-direction:column;gap:4px;min-width:0;align-items:flex-start}
    .swlabel{font-weight:700;font-size:14px}
    .chip{font:700 11px/1.3 var(--kg-font-body);color:var(--kg-primary-text);background:var(--kg-primary-tint);border-radius:12px;padding:3px 8px}

    .switch{position:relative;display:inline-block;width:46px;height:27px;flex:none}
    .switch input{opacity:0;width:0;height:0;position:absolute}
    .slider{position:absolute;inset:0;background:var(--kg-track-2);border-radius:999px;transition:background 180ms ease;cursor:pointer}
    .slider::before{content:"";position:absolute;height:21px;width:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform 180ms ease;box-shadow:var(--kg-shadow-knob)}
    .switch input:checked+.slider{background:var(--kg-primary)}
    .switch input:checked+.slider::before{transform:translateX(19px)}
    .switch input:disabled+.slider{opacity:.55;cursor:default}

    .kbbox{flex:1;min-width:0;height:48px;padding:0 14px;border:2px solid var(--kg-border);border-radius:16px;background:var(--kg-surface-2);display:flex;align-items:center;cursor:pointer}
    .kbbox .ph{font:500 15px/1.3 var(--kg-font-body);color:var(--kg-hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .kbbox .val{font-family:var(--kg-mono);font-size:13px;color:var(--kg-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #patch{flex:1;min-width:0;padding:11px 14px;border:2px solid var(--kg-border);border-radius:16px;background:var(--kg-surface-2);color:var(--kg-ink);font:800 22px/1.3 var(--kg-font-display);letter-spacing:.02em}
    #patch:focus{outline:none;border-color:var(--kg-primary)}
    #patch.err{border-color:var(--kg-danger)}
    #patch::placeholder{color:var(--kg-hint)}

    .iconbtn{width:48px;height:48px;flex:none;border-radius:999px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 120ms ease}
    .iconbtn:active{transform:scale(.96)}
    .iconbtn svg{width:20px;height:20px}
    .iconbtn.sec{border:2px solid var(--kg-border-2);background:var(--kg-surface);color:var(--kg-ink-2)}
    .iconbtn.pri{border:2px solid var(--kg-primary);background:var(--kg-primary);color:var(--kg-on-primary)}

    .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:100%;max-width:460px;padding:0 20px;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:10}
    .dock>*{pointer-events:auto}
    .toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;box-shadow:var(--kg-shadow-float);background:var(--kg-success-tint)}
    .toast.wrong{background:var(--kg-danger-tint)}
    .toast-ic{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--kg-success)}
    .toast.wrong .toast-ic{background:var(--kg-danger)}
    .toast-ic svg{width:15px;height:15px}
    .toast-title{font-weight:700;font-size:13.5px;color:var(--kg-success-text)}
    .toast-title svg{width:14px;height:14px;vertical-align:-2px}
    .toast.wrong .toast-title{color:var(--kg-danger-text)}
    .toast-detail{font-size:12px;color:var(--kg-muted);line-height:1.4}

    .savebar{background:var(--kg-surface);border:1px solid var(--kg-border);border-radius:22px;box-shadow:var(--kg-shadow-float);padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px}
    .savebar-text{flex:1;min-width:0}
    .savebar-title{font-weight:700;font-size:14px;color:var(--kg-ink)}
    .savebar-title.err{color:var(--kg-danger-text)}
    .savebar-detail{font-size:12px;line-height:1.45;color:var(--kg-muted);text-wrap:pretty}

    .btn{font-family:var(--kg-font-body);font-weight:700;font-size:14px;border:2px solid var(--kg-primary);background:var(--kg-primary);color:var(--kg-on-primary);border-radius:999px;padding:9px 18px;cursor:pointer;white-space:nowrap;transition:transform 120ms ease;user-select:none}
    .btn:active{transform:scale(.97)}
    .btn:disabled{background:var(--kg-border-2);border-color:var(--kg-border-2);color:var(--kg-muted);cursor:not-allowed;transform:none}
    .btn.sec{background:var(--kg-surface);border-color:var(--kg-border-2);color:var(--kg-ink-2)}
    .btn.full{width:100%;padding:13px 18px}

    .nav{display:flex;gap:4px;background:var(--kg-surface);border:1px solid var(--kg-border);border-radius:999px;box-shadow:var(--kg-shadow-float);padding:6px}
    .navitem{flex:1;text-align:center;border:0;background:none;font-family:var(--kg-font-body);font-weight:700;font-size:12.5px;color:var(--kg-muted);padding:10px 4px;border-radius:999px;cursor:pointer;white-space:nowrap;user-select:none}
    .navitem.active{background:var(--kg-primary-tint);color:var(--kg-primary-text)}

    .scrim{position:fixed;inset:0;z-index:20;background:var(--kg-scrim);display:flex;align-items:center;justify-content:center;padding:24px}
    .dialog{width:100%;max-width:400px;background:var(--kg-surface);border-radius:30px;padding:26px 22px 20px;box-shadow:var(--kg-shadow-dialog);display:flex;flex-direction:column;gap:8px}
    .dialog-title{font:800 22px/1.25 var(--kg-font-display)}
    .dialog-body{font-size:14px;line-height:1.6;color:var(--kg-muted)}
    .dialog-actions{display:flex;gap:10px;margin-top:14px}
    .dialog-actions .btn{flex:1}

    .reboot{position:fixed;inset:0;z-index:30;background:var(--kg-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 48px;text-align:center}
    .reboot-title{font:800 22px/1.25 var(--kg-font-display)}
    .reboot-detail{font-size:13px;color:var(--kg-muted)}
    .progress{width:220px;height:8px;border-radius:999px;background:var(--kg-track);overflow:hidden;margin-top:10px}
    .progress-fill{height:100%;width:38%;border-radius:999px;background:var(--kg-primary);animation:indet 1.2s ease-in-out infinite}
    @keyframes indet{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    :focus-visible{outline:2px solid var(--kg-primary);outline-offset:3px}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="pull" id="pull"><div class="pull-pill" id="pull-pill"></div></div>
    <header class="head">
      <div class="head-top">
        <h1 class="title">Don't mind me</h1>
        <div class="pill"><span class="pill-dot" id="pill-dot"></span><span id="pill-label"></span></div>
      </div>
      <div class="subhead" id="sub-apps">
        <div class="subhead-row"><div class="h2" data-i18n="appsHead"></div><div class="count" id="count"></div></div>
        <div class="search-wrap">
          <input id="search" type="search" autocomplete="off">
          <div class="search-clear" id="search-clear" role="button" aria-label="Clear" hidden>×</div>
        </div>
      </div>
      <div class="subhead" id="sub-spoof" hidden><div class="h2" data-i18n="spoofHead"></div></div>
      <div class="subhead" id="sub-keybox" hidden><div class="h2" data-i18n="certHead"></div></div>
      <div class="subhead" id="sub-system" hidden><div class="h2" data-i18n="sysHead"></div></div>
    </header>

    <main class="body">
      <section class="panel" id="tab-apps">
        <div class="card list" id="apps"></div>
      </section>

      <section class="panel" id="tab-spoof" hidden>
        <div class="card list" id="flags"></div>
      </section>

      <section class="panel" id="tab-keybox" hidden>
        <div class="group">
          <div class="slabel" data-i18n="kbSection">Keybox</div>
          <div class="card pad">
            <div class="col">
              <div class="flabel" data-i18n="kbFileLabel"></div>
              <input type="file" id="kb-file" hidden>
              <div class="inrow">
                <div class="kbbox" id="kb-box" role="button" tabindex="0"><span class="ph" id="kb-box-text"></span></div>
                <div class="iconbtn sec" id="kb-open" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></div>
                <div class="iconbtn pri" id="kb-set" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg></div>
              </div>
              <div class="hint" id="kb-hint"></div>
              <div class="line-ok" id="kb-setline" hidden></div>
            </div>
          </div>
        </div>
        <div class="group">
          <div class="slabel" data-i18n="patchSection"></div>
          <div class="card pad">
            <div class="col">
              <div class="flabel" data-i18n="patchLabel"></div>
              <div class="inrow">
                <input type="text" id="patch" inputmode="numeric" maxlength="10" placeholder="2026-10-05">
                <div class="iconbtn sec" id="patch-fetch" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg></div>
                <div class="iconbtn pri" id="patch-apply" role="button" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg></div>
              </div>
              <div class="hint" id="patch-hint"></div>
              <div class="line-err" id="patch-err" hidden></div>
              <div class="line-ok" id="patch-ok" hidden></div>
            </div>
          </div>
        </div>
      </section>

      <section class="panel" id="tab-system" hidden>
        <div class="group">
          <div class="slabel" data-i18n="usbSection">USB debugging</div>
          <div class="card pad-sm">
            <div class="swrow"><div class="swtext"><div class="swlabel" data-i18n="adbSwLabel"></div></div><label class="switch"><input type="checkbox" id="adb-toggle"><span class="slider"></span></label></div>
          </div>
        </div>
        <div class="group">
          <div class="slabel" data-i18n="notifSection"></div>
          <div class="card pad-sm">
            <div class="swrow"><div class="swtext"><div class="swlabel" data-i18n="notifSwLabel"></div></div><label class="switch"><input type="checkbox" id="notify-toggle"><span class="slider"></span></label></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="dock">
    <div class="toast" id="toast" hidden>
      <div class="toast-ic" id="toast-ic"></div>
      <div><div class="toast-title" id="toast-title"></div><div class="toast-detail" id="toast-detail" hidden></div></div>
    </div>
    <div class="savebar" id="savebar" hidden>
      <div class="savebar-text"><div class="savebar-title" id="save-title"></div><div class="savebar-detail" id="save-detail"></div></div>
      <button type="button" class="btn" id="save-btn"></button>
    </div>
    <nav class="nav" id="nav">
      <button type="button" class="navitem active"></button>
      <button type="button" class="navitem"></button>
      <button type="button" class="navitem"></button>
      <button type="button" class="navitem"></button>
    </nav>
  </div>

  <div class="scrim" id="dialog" hidden>
    <div class="dialog" id="dialog-card">
      <div class="dialog-title" id="dlg-title"></div>
      <div class="dialog-body" id="dlg-body"></div>
      <div class="dialog-actions">
        <button type="button" class="btn sec" id="dlg-cancel" data-i18n="cancel"></button>
        <button type="button" class="btn" id="dlg-confirm"></button>
      </div>
    </div>
  </div>

  <div class="reboot" id="reboot" hidden>
    <div class="reboot-title" data-i18n="rbTitle"></div>
    <div class="reboot-detail" data-i18n="rbDetail"></div>
    <div class="progress"><div class="progress-fill"></div></div>
  </div>

  <script>
    const base = '/data/adb/modules/dont_mind_me/webroot/';
    const $ = id => document.getElementById(id);
    const HARD_KEYS = ['spoof_system', 'spoof_fingerprint', 'spoof_utc', 'spoof_date', 'spoof_os_patch', 'spoof_vendor_patch'];
    const FLAGS = ['spoof_system', 'spoof_utc', 'spoof_date', 'spoof_fingerprint', 'spoof_os_patch', 'spoof_vendor_patch'];
    const TABS = ['apps', 'spoof', 'keybox', 'system'];
    const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>';
    const EXT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
    const REF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg>';
    const SAV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>';

    // bilingual: default English, Vietnamese only when the system language is Vietnamese
    const I18N = {

    let packages = [], selected = new Set(), original = new Set(), lines = [], hma, hardFlags = {}, savedFlags = {};
    let dirty = false, busy = false, retry = false, savedScope, needsReboot = false, loading = true, saveError = '', callbackId = 0;
    let tab = 0, kbPick = '', kbFile = null, kbSet = '', dialogKind = null, toastTimer, curPull = 0, rebootGuard;

    function section(text, name) {
      const start = text.indexOf('===' + name + '===');
      if (start < 0) return '';
      const from = text.indexOf('\n', start) + 1;
      const next = text.indexOf('\n===', from);
      return text.slice(from, next < 0 ? undefined : next);
    }
    function run(action, service = 'tricky') {
      return new Promise((resolve, reject) => {
        if (!window.ksu || typeof ksu.exec !== 'function') return reject(new Error(L.noRoot));
        const cb = `cb${++callbackId}`;
        window[cb] = (errno, stdout, stderr) => {
          delete window[cb];
          if (errno) { const raw = (stderr || stdout || '').trim(); reject(new Error(raw ? errText(raw) : L.cmdFail(errno))); }
          else resolve(stdout);
        };
        try { ksu.exec(`sh ${base}${service === 'hma' ? 'api' : `${service}-api`}.sh ${action}`, '{}', cb); }
        catch (error) { delete window[cb]; reject(error); }
      });
    }

    function toast(title, ok = true, detail = '', html = false) {
      clearTimeout(toastTimer);
      const t = $('toast');
      t.classList.toggle('wrong', !ok);
      $('toast-ic').innerHTML = ok ? CHECK : CROSS;
      if (html) $('toast-title').innerHTML = title; else $('toast-title').textContent = title;
      const d = $('toast-detail');
      d.textContent = detail || '';
      d.hidden = !detail;
      t.hidden = false;
      toastTimer = setTimeout(() => { t.hidden = true; }, 3400);
    }

    function diff() {
      let add = 0, rem = 0;
      selected.forEach(n => { if (!original.has(n)) add++; });
      original.forEach(n => { if (!selected.has(n)) rem++; });
      const fl = HARD_KEYS.filter(k => !!hardFlags[k] !== !!savedFlags[k]).length;
      return { add, rem, fl };
    }
    function pillState() {
      if (loading) return [L.pLoading, 'var(--kg-hint)'];
      if (busy) return [L.pSaving, 'var(--kg-primary)'];
      if (saveError) return [L.pError, 'var(--kg-danger)'];
      if (dirty) return [L.pUnsaved, 'var(--kg-primary)'];
      if (needsReboot) return [L.pReboot, 'var(--kg-gold)'];
      return [L.pSynced, 'var(--kg-success)'];
    }
    function showSave(title, detail, action, disabled, err) {
      $('savebar').hidden = false;
      $('save-title').textContent = title;
      $('save-title').classList.toggle('err', !!err);
      $('save-detail').textContent = detail || '';
      const b = $('save-btn');
      b.textContent = action;
      b.disabled = !!disabled;
    }
    function updateChrome() {
      const [label, dot] = pillState();
      $('pill-label').textContent = label;
      $('pill-dot').style.background = dot;
      $('count').textContent = L.count(selected.size);
      TABS.forEach((name, i) => { $('sub-' + name).hidden = i !== tab; $('tab-' + name).hidden = i !== tab; });
      [...$('nav').children].forEach((b, i) => b.classList.toggle('active', i === tab));

      const d = diff();
      const parts = [];
      if (d.add) parts.push(L.dapp(d.add));
      if (d.rem) parts.push(L.drem(d.rem));
      if (d.fl) parts.push(L.dfl(d.fl));
      const detail = parts.join(' · ');
      if (loading) $('savebar').hidden = true;
      else if (busy) showSave(L.sbSaving, detail, L.saveApps, true, false);
      else if (saveError) showSave(L.sbErrTitle, saveError, L.saveApps, false, true);
      else if (dirty) showSave(L.sbUnsavedTitle, detail || L.sbSyncHint, L.saveApps, false, false);
      else if (needsReboot) showSave(L.sbSavedTitle, L.sbSavedDetail, L.rebootBtn, false, false);
      else $('savebar').hidden = true;

      for (const k of FLAGS) {
        const sw = $('sw-' + k);
        if (sw) sw.checked = !!hardFlags[k];
        const chip = $('chip-' + k);
        if (chip) chip.hidden = loading || !!hardFlags[k] === !!savedFlags[k];
      }
    }

    function skeleton() {
      const widths = ['62%', '48%', '70%', '55%', '40%', '66%'];
      $('apps').innerHTML = widths.map(w => `<div class="skel"><div class="box"></div><div class="bar" style="width:${w}"></div></div>`).join('');
    }
    function appRow(name) {
      const row = document.createElement('div');
      row.className = 'approw' + (selected.has(name) ? ' sel' : '');
      const chk = document.createElement('span');
      chk.className = 'check';
      chk.innerHTML = CHECK;
      const pkg = document.createElement('span');
      pkg.className = 'pkg';
      pkg.textContent = name;
      row.append(chk, pkg);
      row.addEventListener('click', () => {
        if (busy) return;
        if (selected.has(name)) selected.delete(name); else selected.add(name);
        row.classList.toggle('sel', selected.has(name));
        markDirty();
      });
      return row;
    }
    function renderApps() {
      const host = $('apps');
      if (loading) { skeleton(); return; }
      const query = $('search').value.trim().toLowerCase();
      const visible = packages.filter(n => n.toLowerCase().includes(query))
        .sort((a, b) => (selected.has(b) ? 1 : 0) - (selected.has(a) ? 1 : 0));
      host.textContent = '';
      $('search-clear').hidden = !$('search').value;
      if (!visible.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = packages.length ? L.emptyNoMatch : L.emptyNone;

      }
      const frag = document.createDocumentFragment();
      for (const name of visible) frag.append(appRow(name));

    function buildFlags() {
      $('flags').innerHTML = FLAGS.map(k =>
        `<div class="swrow"><div class="swtext"><div class="swlabel">${L.flags[k]}</div><span class="chip" id="chip-${k}" hidden>${L.chipUnsaved}</span></div><label class="switch"><input type="checkbox" id="sw-${k}"><span class="slider"></span></label></div>`

    function markDirty() {

    async function load() {

        savedFlags = { ...hardFlags };
        $('adb-toggle').checked = section(bundle, 'ADB').trim() === '1';
        $('notify-toggle').checked = section(bundle, 'NOTIFY').trim() === '1';
        const names = list.split('\n').map(v => v.trim()).filter(v => /^[a-zA-Z0-9_.]+$/.test(v)).sort();
        const targetLines = text.split('\n');
        const targets = new Set(targetLines.map(line => line.trim().replace(/[!?]$/, '')).filter(name => names.includes(name)));
        const whitelisted = new Set(names.filter(name => next.scope[name]?.useWhitelist === true));

        original = new Set([...targets, ...whitelisted]);

    async function persist() {

        const kept = lines.filter(line => !packages.includes(line.trim().replace(/[!?]$/, '')) || selected.has(line.trim().replace(/[!?]$/, '')));
        const existing = new Set(kept.map(line => line.trim().replace(/[!?]$/, '')));
        const added = [...selected].filter(name => !existing.has(name)).sort();
        const next = [...kept, ...added].join('\n').replace(/\n*$/, '\n');
        const scope = { ...hma.scope };

    async function readB64(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      let s = ''; const C = 0x8000;
      for (let i = 0; i < bytes.length; i += C) s += String.fromCharCode.apply(null, bytes.subarray(i, i + C));
      return btoa(s);
    }

        $('kb-setline').hidden = false;
        toast(L.kbSetOk, true, kbSet);

      finally { $('kb-set').style.opacity = ''; }
    }

    // patch
    function onPatch() {
      const el = $('patch');
      const digits = el.value.replace(/\D/g, '').slice(0, 8);

    }
    async function fetchPatch() {
      $('patch-fetch').style.opacity = '.5';

        $('patch').value = (await run('patch')).trim();
        $('patch').classList.remove('err');
        $('patch-err').hidden = true;
        toast(L.patchFetchOkPre + SAV + L.patchFetchOkPost, true, '', true);
      } catch (error) { toast(error.message, false); }
      finally { $('patch-fetch').style.opacity = ''; }
    }
    async function applyPatch() {
      const date = $('patch').value.trim();
      if (!/^20\d{2}-(0[1-9]|1[0-2])-0[15]$/.test(date)) {
        $('patch').classList.add('err');
        $('patch-err').textContent = L.patchBad;
        $('patch-err').hidden = false;
        $('patch-ok').hidden = true;
        return;
      }
      $('patch-apply').style.opacity = '.5';
      try {
        await run(`set-patch ${date}`);
        $('patch-ok').textContent = L.patchSetLine(date);
        $('patch-ok').hidden = false;
        toast(L.patchSetOk, true, date);
      } catch (error) { toast(error.message, false); }
      finally { $('patch-apply').style.opacity = ''; }
    }

    async function toggleSys(id, action, label) {
      const el = $(id);
      const on = el.checked;
      el.disabled = true;
      try { await run(`${action} ${on ? 1 : 0}`, 'hard'); toast(on ? L.on(label) : L.off(label)); }
      catch (error) { el.checked = !on; toast(error.message, false); }
      finally { el.disabled = false; }
    }

    // pull to refresh
    function setPull(h, animate) {
      const el = $('pull');
      el.classList.toggle('drag', !animate);
      el.style.height = h + 'px';
      el.style.opacity = Math.min(h / 40, 1);
      curPull = h;
      $('pull-pill').textContent = h >= 64 ? L.pullRelease : L.pullIdle;
    }
    function setPullLoading(on) {
      const el = $('pull');
      el.classList.remove('drag');
      if (on) { el.style.height = '44px'; el.style.opacity = '1'; $('pull-pill').textContent = L.pullLoading; }
      else { el.style.height = '0'; el.style.opacity = '0'; }
    }

    function applyLang() {
      document.documentElement.lang = LANG;
      for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = L[el.dataset.i18n];
      $('search').placeholder = L.searchPh;
      $('pull-pill').textContent = L.pullIdle;
      $('kb-hint').innerHTML = L.kbHintPre + EXT + L.kbHintPost;
      $('patch-hint').innerHTML = L.patchHintPre + REF + L.patchHintPost;
      $('kb-open').title = L.kbOpenTitle; $('kb-open').setAttribute('aria-label', L.kbOpenTitle);
      $('kb-set').title = L.kbSetBtn; $('kb-set').setAttribute('aria-label', L.kbSetBtn);
      $('patch-fetch').title = L.patchFetchTitle; $('patch-fetch').setAttribute('aria-label', L.patchFetchTitle);
      $('patch-apply').title = L.patchApplyBtn; $('patch-apply').setAttribute('aria-label', L.patchApplyBtn);
      [...$('nav').children].forEach((b, i) => b.textContent = L.nav[i]);
      setKbText();
    }

    // wiring
    applyLang();
    buildFlags();
    $('search').addEventListener('input', renderApps);
    $('search-clear').addEventListener('click', () => { $('search').value = ''; renderApps(); });
    [...$('nav').children].forEach((b, i) => b.addEventListener('click', () => setTab(i)));
    $('save-btn').addEventListener('click', () => { if (!dirty && needsReboot && !busy) openDialog('reboot'); else persist(); });
    $('adb-toggle').addEventListener('change', () => toggleSys('adb-toggle', 'adbset', L.adbName));
    $('notify-toggle').addEventListener('change', () => toggleSys('notify-toggle', 'notifyset', L.notifName));
    $('kb-box').addEventListener('click', () => $('kb-file').click());
    $('kb-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) { kbFile = f; kbPick = f.name; setKbText(); } });
    $('kb-open').addEventListener('click', async () => { try { await run('open-keybox'); toast(L.kbOpenOk, true, L.kbOpenDetail); } catch (error) { toast(error.message, false); } });
    $('kb-set').addEventListener('click', setKeybox);
    $('patch').addEventListener('input', onPatch);
    $('patch-fetch').addEventListener('click', fetchPatch);
    $('patch-apply').addEventListener('click', applyPatch);
    $('dlg-cancel').addEventListener('click', closeDialog);
    $('dialog').addEventListener('click', e => { if (e.target === $('dialog')) closeDialog(); });
    $('dlg-confirm').addEventListener('click', () => { if (dialogKind === 'reboot') startReboot(); else { closeDialog(); load(); } });

    let pullStartY = null;
    addEventListener('touchstart', e => { pullStartY = (scrollY <= 0 && !loading && !busy && !dialogKind) ? e.touches[0].clientY : null; }, { passive: true });
    addEventListener('touchmove', e => { if (pullStartY == null) return; const dy = e.touches[0].clientY - pullStartY; if (dy > 0) setPull(Math.min(dy * 0.5, 96), false); }, { passive: true });
    addEventListener('touchend', () => { if (pullStartY == null) return; const go = curPull >= 64; pullStartY = null; setPull(0, true); if (go) requestRefresh(); }, { passive: true });

    setTab(0);
    load();
  </script>
</body>
</html>
